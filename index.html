<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>canmas coffee - 精品豆單</title>
<meta name="description" content="肯馬仕精品咖啡 CANMAS Coffee，竹北預約制精品咖啡bistro，精選世界各地莊園咖啡豆">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Noto+Serif+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:          #111E4A;
  --bg-1:        #162258;
  --bg-2:        #1A2A6A;
  --bg-3:        #1F3278;
  --bg-4:        #253C8C;
  --cobalt:      #1A3FC8;
  --cobalt-bright:#2952D8;
  --gold:        #D4A843;
  --gold-light:  #EFC76A;
  --gold-pale:   #F7E9C4;
  --cream:       #EEE8D8;
  --silver:      #B8C8E8;
  --silver-dim:  #6878A8;
  --silver-dark: #364070;
  --danger:      #E05555;
  --border-gold: rgba(212,168,67,0.28);
  --border-blue: rgba(184,200,232,0.12);
  --border-soft: rgba(184,200,232,0.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--cream);font-family:'Noto Serif TC',serif;min-height:100vh;-webkit-font-smoothing:antialiased;}

.header{background:var(--bg-1);border-bottom:1px solid var(--border-gold);padding:1.5rem 1.5rem 1.25rem;position:sticky;top:0;z-index:100;}
.header-inner{max-width:680px;margin:0 auto;}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;}
.brand-name{font-family:'Cinzel',serif;font-size:26px;font-weight:500;letter-spacing:0.1em;color:var(--gold);}
.brand-sub{font-size:13px;color:var(--silver-dim);letter-spacing:0.15em;margin-top:4px;}
.mail-btn{display:flex;align-items:center;gap:7px;background:var(--silver-dark);color:var(--cream);border:1px solid var(--border-blue);border-radius:28px;padding:10px 18px;font-size:14px;font-weight:500;font-family:'Noto Serif TC',serif;cursor:pointer;text-decoration:none;white-space:nowrap;flex-shrink:0;}
.search-wrap{position:relative;}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:0.4;pointer-events:none;}
.search-input{width:100%;background:var(--bg-3);border:1px solid var(--border-blue);border-radius:10px;color:var(--cream);font-family:'Noto Serif TC',serif;font-size:15px;padding:11px 14px 11px 38px;outline:none;}
.search-input::placeholder{color:var(--silver-dark);}

.tabs-wrap{background:var(--bg-1);border-bottom:1px solid var(--border-gold);overflow-x:auto;scrollbar-width:none;}
.tabs-wrap::-webkit-scrollbar{display:none;}
.tabs{display:flex;padding:0 1.5rem;max-width:680px;margin:0 auto;}
.tab{padding:13px 16px;font-size:15px;font-family:'Noto Serif TC',serif;color:var(--silver-dim);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}

.count-bar{padding:8px 1.5rem;font-size:12px;color:var(--silver-dark);background:var(--bg-2);border-bottom:1px solid var(--border-soft);}
.count-bar-inner{max-width:680px;margin:0 auto;}

.list{padding-bottom:9rem;max-width:680px;margin:0 auto;}
.item{padding:20px 1.5rem;border-bottom:1px solid var(--border-soft);}
.item.sold-out{opacity:0.3;}
.item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px;}
.item-name{font-size:16px;font-weight:500;color:var(--cream);line-height:1.5;flex:1;}
.price-block{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.price-row{display:flex;align-items:center;gap:6px;}
.price-label{font-size:11px;color:var(--silver-dim);}
.price-value{font-size:15px;color:var(--gold-light);font-weight:500;}

.item-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.tag{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--border-blue);color:var(--silver-dim);background:var(--bg-3);}

.item-notes{font-size:14px;color:var(--silver);line-height:1.8;margin-bottom:12px;}
.add-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.size-select{background:var(--bg-3);border:1px solid var(--border-blue);border-radius:8px;color:var(--cream);font-family:'Noto Serif TC',serif;font-size:13px;padding:7px 10px;}
.qty-wrap{display:flex;align-items:center;gap:5px;}
.qty-btn{width:30px;height:30px;background:var(--bg-3);border:1px solid var(--border-blue);border-radius:7px;color:var(--cream);font-size:17px;cursor:pointer;}
.qty-val{font-size:14px;color:var(--cream);min-width:22px;text-align:center;}
.add-btn{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--gold-light);border-radius:8px;color:var(--gold-light);font-size:13px;padding:7px 14px;cursor:pointer;}

.cart-fab{position:fixed;bottom:1.75rem;right:1.5rem;z-index:200;display:flex;align-items:center;gap:9px;background:var(--gold);color:var(--bg);border:none;border-radius:32px;padding:14px 22px;font-size:15px;font-weight:500;font-family:'Noto Serif TC',serif;cursor:pointer;box-shadow:0 6px 24px rgba(212,168,67,0.45);}
.cart-badge{background:var(--danger);color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:500;}

.overlay{position:fixed;inset:0;background:rgba(8,14,40,0.88);z-index:300;opacity:0;pointer-events:none;}
.overlay.show{opacity:1;pointer-events:all;}

.cart-panel{position:fixed;bottom:0;left:0;right:0;max-width:680px;margin:0 auto;background:var(--bg-1);border-top:1px solid var(--border-gold);border-radius:22px 22px 0 0;z-index:400;transform:translateY(100%);transition:transform 0.3s;max-height:92vh;overflow-y:auto;}
.cart-panel.show{transform:translateY(0);}
.cart-header{display:flex;align-items:center;justify-content:space-between;padding:1.5rem 1.5rem 1.1rem;border-bottom:1px solid var(--border-soft);position:sticky;top:0;background:var(--bg-1);z-index:1;}
.cart-title{font-size:17px;font-weight:500;color:var(--cream);}
.cart-close{background:none;border:none;color:var(--silver-dim);font-size:24px;cursor:pointer;}
.cart-items{padding:0.75rem 1.5rem;}
.cart-item{display:flex;align-items:flex-start;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border-soft);gap:10px;}
.cart-item-info{flex:1;}
.cart-item-name{font-size:14px;color:var(--cream);line-height:1.5;}
.cart-item-detail{font-size:12px;color:var(--silver-dim);margin-top:3px;}
.cart-item-subtotal{font-size:13px;color:var(--gold-light);margin-top:3px;}
.cart-item-remove{background:none;border:none;color:var(--silver-dark);cursor:pointer;font-size:20px;}
.cart-empty{padding:2.5rem;text-align:center;color:var(--silver-dark);font-size:14px;}

.cart-total{padding:14px 1.5rem;border-top:1px solid var(--border-gold);display:flex;justify-content:space-between;align-items:center;background:var(--bg-2);}
.cart-total-label{font-size:14px;color:var(--silver);}
.cart-total-amount{font-size:20px;color:var(--gold);font-weight:500;}

.order-form{padding:1.25rem 1.5rem 2rem;border-top:1px solid var(--border-soft);}
.form-section-title{font-size:14px;color:var(--silver-dim);margin-bottom:1.1rem;padding-bottom:8px;border-bottom:1px solid var(--border-soft);}
.form-group{margin-bottom:14px;}
.form-label{font-size:13px;color:var(--silver);display:block;margin-bottom:6px;}
.form-label span{color:var(--danger);font-weight:bold;margin-left:4px;}
.form-input{width:100%;background:var(--bg-2);border:1px solid var(--border-blue);border-radius:9px;color:var(--cream);font-size:15px;padding:11px 14px;outline:none;font-family:'Noto Serif TC',serif;}

select.form-input {
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
  background-image: url('data:image/svg+xml;utf8,<svg fill="%23B8C8E8" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>');
  background-repeat: no-repeat;
  background-position-x: 96%;
  background-position-y: center;
  padding-right: 32px;
}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.address-row {display:flex; gap:10px; margin-bottom:10px;}

.payment-options { display: flex; gap: 15px; margin-bottom: 15px; }
.payment-option { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--cream); cursor: pointer; }

.submit-btn{width:100%;background:var(--gold);color:var(--bg);border:none;border-radius:11px;padding:15px;font-size:16px;font-weight:500;font-family:'Noto Serif TC',serif;cursor:pointer;margin-top:6px;}
.submit-btn:disabled{opacity:0.45;cursor:not-allowed;}

.success-panel{padding:3rem 1.5rem;text-align:center;}
.success-title{font-size:18px;font-weight:500;color:var(--cream);margin-bottom:10px;}
.success-msg{font-size:14px;color:var(--silver);line-height:1.8;margin-bottom: 15px;}
.order-num{font-size:13px;color:var(--gold);margin-top:12px;letter-spacing:0.08em;}
.bank-info { background: var(--bg-2); padding: 15px; border-radius: 8px; text-align: left; font-size: 13px; color: var(--cream); line-height: 1.6; margin-bottom: 15px; border: 1px solid var(--border-blue); }

.footer{padding:2.5rem 1.5rem;text-align:center;max-width:680px;margin:0 auto;}
.footer-brand{font-size:15px;color:var(--gold);margin-bottom:14px;}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-top">
      <div>
        <div class="brand-name">canmas coffee</div>
        <div class="brand-sub">精品咖啡豆單 · 竹北預約制</div>
      </div>
      <a class="mail-btn" href="mailto:canmas13@gmail.com" target="_blank" rel="noopener">聯絡我們</a>
    </div>
    <div class="search-wrap">
      <input class="search-input" id="search" type="text" placeholder="搜尋豆名、風味、產地…" oninput="render()">
    </div>
  </div>
</header>

<div class="tabs-wrap"><div class="tabs" id="tabs"></div></div>
<div class="count-bar"><div class="count-bar-inner" id="count-bar"></div></div>
