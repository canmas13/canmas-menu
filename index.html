*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}

.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:0.4;pointer-events:none;}

.tabs-wrap{background:var(--bg-1);border-bottom:1px solid var(--border-gold);overflow-x:auto;scrollbar-width:none;}
.tabs-wrap::-webkit-scrollbar{display:none;}
.tabs{display:flex;padding:0 1.5rem;max-width:680px;margin:0 auto;}
.tab{padding:13px 16px;font-size:15px;font-family:'Noto Serif TC',serif;color:var(--silver-dim);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}

.count-bar{padding:8px 1.5rem;font-size:12px;color:var(--silver-dark);background:var(--bg-2);border-bottom:1px solid var(--border-soft);}
.count-bar-inner{max-width:680px;margin:0 auto;}

.item{padding:20px 1.5rem;border-bottom:1px solid var(--border-soft);}

.price-label{font-size:11px;color:var(--silver-dim);}
.price-value{font-size:15px;color:var(--gold-light);font-weight:500;}

.item-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.tag{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--border-blue);color:var(--silver-dim);background:var(--bg-3);}

.cart-fab{position:fixed;bottom:1.75rem;right:1.5rem;z-index:200;display:flex;align-items:center;gap:9px;background:var(--gold);color:var(--bg);border:none;border-radius:32px;padding:14px 22px;font-size:15px;font-weight:500;font-family:'Noto Serif TC',serif;cursor:pointer;box-shadow:0 6px 24px rgba(212,168,67,0.45);}

.overlay{position:fixed;inset:0;background:rgba(8,14,40,0.88);z-index:300;opacity:0;pointer-events:none;}

.cart-panel{position:fixed;bottom:0;left:0;right:0;max-width:680px;margin:0 auto;background:var(--bg-1);border-top:1px solid var(--border-gold);border-radius:22px 22px 0 0;z-index:400;transform:translateY(100%);transition:transform 0.3s;max-height:92vh;overflow-y:auto;}

.cart-header{display:flex;align-items:center;justify-content:space-between;padding:1.5rem 1.5rem 1.1rem;border-bottom:1px solid var(--border-soft);position:sticky;top:0;background:var(--bg-1);z-index:1;}

function parsePrice(raw){
  if(!raw)return{half:"",one:""};
  const m=raw.match(/半磅[^\d]*(\d+)[^一\/]*[一\/]?[磅]?[^\d]*(\d+)?/);
  if(m)return{half:m[1]||"",one:m[2]||""};
  const s=raw.match(/(\d+)/);
  return{half:"",one:s?s[1]:raw};
}

  if(d.soldOut)return`<span style="font-size:14px;color:var(--silver-dark)">售完</span>`;
  if(d.half&&d.one)return`<div class="price-block"><div class="price-row"><span class="price-label">半磅</span><span class="price-value">$${d.half}</span></div><div class="price-row"><span class="price-label">一磅</span><span class="price-value">$${d.one}</span></div></div>`;
  if(d.one)return`<div class="price-block"><div class="price-row"><span class="price-value">$${d.one}</span></div></div>`;
  if(d.half)return`<div class="price-block"><div class="price-row"><span class="price-label">半磅</span><span class="price-value">$${d.half}</span></div></div>`;
  return"";
}

function buildSizeOptions(d){
  const o=[];
  if(d.half)o.push(`<option value="半磅|${d.half}">半磅 $${d.half}</option>`);
  if(d.one)o.push(`<option value="一磅|${d.one}">一磅 $${d.one}</option>`);
  return o.join("");
}

function getQty(idx){return qtyMap[idx]||1;}
function setQty(idx,v){qtyMap[idx]=Math.max(1,v);const el=document.getElementById(`qty-${idx}`);if(el)el.textContent=qtyMap[idx];}

function render(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const f=allData.filter(d=>{
    const rm=activeRegion==="全部"||d.region===activeRegion;
    const sm=!q||d.name.toLowerCase().includes(q)||d.notes.toLowerCase().includes(q)||d.process.includes(q)||d.region.includes(q);
    return rm&&sm;
  });
  document.getElementById("count-bar").textContent=`共 ${f.length} 款`;
  const list=document.getElementById("list");
  if(!f.length){list.innerHTML='<div class="no-result">找不到符合的咖啡豆</div>';return;}
  list.innerHTML=f.map(d=>{
    const idx=allData.indexOf(d);
    const canAdd=!d.soldOut&&(d.half||d.one);
    return`<div class="item${d.soldOut?" sold-out":""}">
      <div class="item-top"><div class="item-name">${d.name}</div>${buildPriceHTML(d)}</div>
      <div class="item-tags">
        <span class="tag process">${d.process}</span>
      </div>
      <div class="item-notes">${d.notes}</div>
      ${canAdd?`<div class="add-row">
        <select class="size-select" id="size-${idx}">${buildSizeOptions(d)}</select>
        <div class="qty-wrap">
          <button class="qty-btn" onclick="setQty(${idx},getQty(${idx})-1)">−</button>
          <span class="qty-val" id="qty-${idx}">${getQty(idx)}</span>
          <button class="qty-btn" onclick="setQty(${idx},getQty(${idx})+1)">+</button>
        </div>
        <button class="add-btn" onclick="addToCart(${idx})">加入清單</button>
      </div>`:""}
    </div>`;
  }).join("");
}

function addToCart(idx){
  const d=allData[idx];
  const sel=document.getElementById(`size-${idx}`);
  const[size,price]=sel.value.split("|");
  const qty=getQty(idx);
  const exist=cart.find(c=>c.name===d.name&&c.size===size);
  if(exist){exist.qty+=qty;}else{cart.push({name:d.name,size,price:Number(price),qty});}
  updateCartBadge();
}

function removeFromCart(i){cart.splice(i,1);updateCartBadge();renderCartBody();}
function cartTotal(){return cart.reduce((s,c)=>s+c.price*c.qty,0);}

function updateCartBadge(){
  const fab=document.getElementById("cartFab");
  const total=cart.reduce((s,c)=>s+c.qty,0);
  document.getElementById("cartBadge").textContent=total;
  fab.style.display=total>0?"flex":"none";
}

function openCart(){renderCartBody();document.getElementById("overlay").classList.add("show");document.getElementById("cartPanel").classList.add("show");}
function closeCart(){document.getElementById("overlay").classList.remove("show");document.getElementById("cartPanel").classList.remove("show");}

// 根據縣市更新鄉鎮市區選項
function updateDistricts() {
  const city = document.getElementById("f-city").value;
  const distSelect = document.getElementById("f-district");
  distSelect.innerHTML = '<option value="">選擇鄉鎮市區</option>';
  if(city && twCounties[city]) {
    twCounties[city].forEach(dist => {
      const opt = document.createElement("option");
      opt.value = dist;
      opt.textContent = dist;
      distSelect.appendChild(opt);
    });
  }
}

function renderCartBody(){
  const el=document.getElementById("cartBody");
  if(!cart.length){el.innerHTML=`<div class="cart-empty">清單是空的</div>`;return;}
  const total=cartTotal();
  el.innerHTML=`
    <div class="cart-items">${cart.map((c,i)=>`
      <div class="cart-item">
        <div class="cart-item-info">
          <div class="cart-item-name">${c.name}</div>
          <div class="cart-item-detail">${c.size} × ${c.qty}</div>
          <div class="cart-item-subtotal">$${(c.price*c.qty).toLocaleString()}</div>
        </div>
        <button class="cart-item-remove" onclick="removeFromCart(${i})">×</button>
      </div>`).join("")}
    </div>
    <div class="cart-total">
      <span class="cart-total-label">合計（未含運費）</span>
      <span class="cart-total-amount">$${total.toLocaleString()}</span>
    </div>
    <div class="order-form">
      <div class="form-section-title">收件資訊與付款方式</div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">姓名</label><input class="form-input" id="f-name" type="text"></div>
        <div class="form-group"><label class="form-label">電話</label><input class="form-input" id="f-phone" type="tel"></div>
      </div>
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="f-email" type="email"></div>
      
      <div class="form-group">
        <label class="form-label">寄送地址</label>
        <div class="address-row">
          <select class="form-input" id="f-city" onchange="updateDistricts()" style="flex:1;">
            <option value="">選擇縣市</option>
          </select>
          <select class="form-input" id="f-district" style="flex:1;">
            <option value="">選擇鄉鎮市區</option>
          </select>
        </div>
        <input class="form-input" id="f-addr-detail" type="text" placeholder="路段、巷弄、門號、樓層">
      </div>
      
      <div class="form-group"><label class="form-label">備註</label><input class="form-input" id="f-note" type="text" placeholder="烘焙度偏好、包裝需求…"></div>
      
      <div class="form-group">
        <label class="form-label">付款方式</label>
        <div class="payment-options">
          <label class="payment-option">
            <input type="radio" name="payment" value="ecpay" checked> 信用卡 / 綠界
          </label>
          <label class="payment-option">
            <input type="radio" name="payment" value="atm"> ATM 匯款
          </label>
        </div>
      </div>

      <button class="submit-btn" onclick="submitOrder()">確認送出</button>
    </div>`;

  // 載入縣市選項
  const citySelect = document.getElementById("f-city");
  if(citySelect) {
    Object.keys(twCounties).forEach(city => {
      const opt = document.createElement("option");
      opt.value = city;
      opt.textContent = city;
      citySelect.appendChild(opt);
    });
  }
}

function genOrderNo(){
  const d=new Date();
  return`CM${d.getFullYear().toString().slice(2)}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(Math.floor(Math.random()*9000)+1000)}`;
}

async function submitOrder(){
  const name=document.getElementById("f-name").value.trim();
  const phone=document.getElementById("f-phone").value.trim();
  const email=document.getElementById("f-email").value.trim();
  const city=document.getElementById("f-city").value;
  const dist=document.getElementById("f-district").value;
  const addrDetail=document.getElementById("f-addr-detail").value.trim();
  const note=document.getElementById("f-note").value.trim();
  const paymentMethod=document.querySelector('input[name="payment"]:checked').value;
  
  if(!name||!phone||!email||!city||!dist||!addrDetail){alert("基本資料與地址請填寫完整");return;}

  const btn=document.querySelector(".submit-btn");
  btn.disabled=true;btn.textContent="處理中…";

  const orderNo=genOrderNo();
  const ts=new Date().toLocaleString("zh-TW",{timeZone:"Asia/Taipei"});
  const addr = city + dist + addrDetail;
  const itemsText=cart.map(c=>`${c.name}（${c.size}×${c.qty}）`).join("、");
  const total=cartTotal();

  // 1. 先把資料往 Google Sheet 送，留存顧客記錄
  try {
    await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        orderNo, timestamp: ts, name, phone, email,
        address: addr, items: itemsText, total, note, 
        status: paymentMethod === 'atm' ? "待匯款" : "待付款"
      })
    });
  } catch(e) {
    console.log("Sheet 寫入失敗", e);
  }

  cart=[];updateCartBadge();

  // 2. 判斷付款方式的後續動作
  if(paymentMethod === 'atm') {
    document.getElementById("cartBody").innerHTML=`
      <div class="success-panel">
        <div class="success-title">訂單已建立！</div>
        <div class="success-msg">請透過以下帳號進行匯款，完成後請 Email 通知我們後五碼。</div>
        <div class="bank-info">${BANK_INFO}</div>
        <div class="order-num">訂單編號：${orderNo}</div>
      </div>`;
  } else {
    // 綠界付款流程
    try{
      const res = await fetch(ORDER_API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({orderNo,timestamp:ts,name,phone,email,address:addr,items:itemsText,total,note,status:"待付款"})
      });
      const json = await res.json();
      if(json.status === "ok"){
        document.getElementById("cartBody").innerHTML=`
          <div class="success-panel">
            <div class="success-title">訂單已建立！</div>
            <div class="success-msg">點擊下方按鈕前往綠界安全的付款環境。</div>
            <button onclick="document.getElementById('ecpay-form').submit()" style="background:#D4A843;color:#111E4A;border:none;border-radius:10px;padding:14px 32px;font-size:16px;cursor:pointer;width:100%;">前往付款</button>
          </div>`;
        
        const form = document.createElement("form");
        form.id = "ecpay-form";
        form.action = json.ecpayAction;
        form.method = "POST";
        form.style.display = "none";
        Object.keys(json.ecpayParams).forEach(k => {
          const input = document.createElement("input");
          input.type = "hidden";
          input.name = k;
          input.value = json.ecpayParams[k];
          form.appendChild(input);
        });
        document.body.appendChild(form);
      }
    }catch(e){
      document.getElementById("cartBody").innerHTML=`<div class="success-panel">系統連線稍有延遲，請稍後再試。</div>`;
    }
  }
}

function setTab(r){activeRegion=r;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.r===r));render();}
function buildTabs(){
  const tabs=document.getElementById("tabs");
  REGIONS.forEach(r=>{
    const t=document.createElement("div");
    t.className="tab"+(r==="全部"?" active":"");
    t.dataset.r=r;t.textContent=r;t.onclick=()=>setTab(r);
    tabs.appendChild(t);
  });
}
function parseCSV(text){
  const lines=text.trim().split("\n");
  const headers=lines[0].split(",").map(h=>h.trim().replace(/^"|"$/g,""));
  return lines.slice(1).map(line=>{
    const cols=[];let cur="",inQ=false;
    for(let c of line){if(c==='"'){inQ=!inQ;continue;}if(c===','&&!inQ){cols.push(cur);cur="";continue;}cur+=c;}
    cols.push(cur);
    const obj={};headers.forEach((h,i)=>obj[h]=(cols[i]||"").trim());
    const pp=parsePrice(obj.price||"");
    return{region:obj.region||"",name:obj.name||"",process:obj.process||"",notes:obj.notes||"",
      half:obj.half||pp.half,one:obj.one||pp.one,
      soldOut:(obj.soldOut||"").toUpperCase()==="TRUE"};
  }).filter(d=>d.name);
}
async function init(){
  buildTabs();
  const CF_PROXY = "https://canmas-proxy.unikch.workers.dev/?url=";
  if(SHEET_CSV_URL){
    try{
      const res=await fetch(CF_PROXY+encodeURIComponent(SHEET_CSV_URL));
      const text=await res.text();
      allData=parseCSV(text);
    }catch(e){console.warn(e);}
  }
  render();
}
init();
</script>
